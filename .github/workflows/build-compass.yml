name: Build Compass from Obsidian

on:
  push:
    branches: [main]
    paths:
      - 'compass/**/*.md'
      - 'website-src/index.template.html'
      - 'scripts/build_compass.py'
      - 'scripts/requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: pip install -r scripts/requirements.txt

      - name: Build Compass pages
        run: python scripts/build_compass.py

      - name: Commit generated website
        run: |
          if git diff --quiet -- website-preview/index.html; then
            echo "No generated website changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website-preview/index.html
          git commit -m "Build Compass pages from Obsidian"
          git push
